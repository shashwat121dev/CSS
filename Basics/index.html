        body{
            background-color: #414141;
        }

        h1 {
            color: #000000;
            text-align: center;
            background-color: #d686be;
            padding: 15px;
            /* margin: 120px; */
            border: solid #fff;
            text-decoration: underline;

        }

        /* span is a inline element but can change to block level  */
        span{
            font-size: 50px;
            color: #ffff;
            text-align: center;
            background-color: blueviolet;
        }

        /* para is a block level element but can be changed to inline element  */
        p{
            font-size: 20px;
            background-color: orange;
        }


    </style>
</head>
<body>
    <h1>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quas sequi dignissimos nobis odio perspiciatis autem tempora eius rerum excepturi nemo?</h1>
